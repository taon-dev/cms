<h1>{{ t.gettext('CMS assets') }}</h1>
<button
  mat-button
  type="button"
  [disabled]="loading()"
  (click)="reload()">
  {{ t.gettext('Reload assets') }}
</button>
@if (loading()) {
  <p role="status">{{ t.gettext('Loading assets...') }}</p>
}
@if (error()) {
  <p role="alert">{{ error() }}</p>
}

<ng-template
  #preview
  let-asset>
  <taon-cms-asset-preview [asset]="asset" />
</ng-template>

<taon-datatable
  [data]="assets()"
  [columns]="columns"
  [allowedColumns]="['key', 'fileName', 'contentType']"
  [hideAddButton]="true"
  [expansionTemplate]="preview"
  searchMode="advanced">
</taon-datatable>
