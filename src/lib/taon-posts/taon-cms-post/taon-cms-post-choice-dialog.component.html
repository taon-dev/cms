<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <mat-radio-group [(ngModel)]="selected" [attr.aria-label]="data.title">
    @for (option of data.options; track option.value) {
      <mat-radio-button [value]="option.value">
        {{ option.label }}
      </mat-radio-button>
    }
  </mat-radio-group>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ t.gettext('Cancel') }}
  </button>
  <button mat-flat-button type="button" (click)="confirm()">
    {{ t.gettext('OK') }}
  </button>
</mat-dialog-actions>
