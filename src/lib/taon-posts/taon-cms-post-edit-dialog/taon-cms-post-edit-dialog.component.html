<header class="dialog-header">
  <h2>
    {{ data.mode === 'add' ? t.gettext('Add post') : t.gettext('Manage post') }}
  </h2>
  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="t.gettext('Close post editor')"
    [disabled]="editor()?.busy() || editor()?.dialogOpen()"
    (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</header>
<taon-cms-post
  [post]="data.post ?? null"
  [mode]="data.mode"
  (changed)="changed.emit($event)"
  (deleted)="deleted($event)"
  (cancelled)="close()" />
